[build-system]
requires = ["setuptools>=68.2.2", "tcod==16.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "starstranded_ryou"
version = "0.4.0"
authors = [
  { name="Ryou", email="ryou.takeshi@gmail.com" },
]
description = "A roguelike survival game set on an alien planet."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]