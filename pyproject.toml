[build-system]
requires = ["setuptools>=68.2.2", "tcod>=21.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starstranded_ryou"
version = "0.4.1"
authors = [
  { name="Ryou", email="ryou.takeshi@gmail.com" },
]
dependencies = [
    "tcod>=21.0.0",
    "pygame-ce>=2.5",
    "numpy",
]
description = "A roguelike survival game set on an alien planet."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["full_world: build the real 5x5 chunk area instead of the quick 3x3 the suite uses by default"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
