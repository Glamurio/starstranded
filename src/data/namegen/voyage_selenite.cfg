//Selenite names, based loosely on Voyage: Journey to the Moon

name "selenite" {
  syllablesStart = "Br, Bel, Bol, Klip, Yrsh, Xul, Prul, Zu, Scr, Scu, Lun"
  syllablesMiddle = "u, oz, ba, ly, ky, da, sg, str, sag, no, tu, ds, br"
  syllablesEnd = "mar, zz, ab, oo, ang, aal, gt, uff, kir, uk, sik, pul, rvy, mis"
  illegal = "Brbr"
  rules = "$s$m$e"
}
