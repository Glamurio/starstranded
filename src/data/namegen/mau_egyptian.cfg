//Mau personal and place names: stylised Egyptian transliteration (the Mau keep an Egyptian hieroglyphic script)

name "mau" {
  syllablesStart = "Ka, Ra, Ne, Se, Ta, Hap, Khe, Mer, Ptah, Isi, Bast, Sekh, Anu, Het, Tem, Nef"
  syllablesMiddle = "t, nef, ra, hot, ab, un, kh, men, sen"
  syllablesEnd = "ep, et, em, ut, is, ra, ar, ankh, ure, ti"
  rules = "$s$m$e, $s$e"
}
